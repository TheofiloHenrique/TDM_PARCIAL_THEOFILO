<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUD - Examen Diseño Multimedia Web</title>
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="mb-4">Gestionar Items</h1>

    <!-- Formulario para crear o editar -->
    <form id="form-item" class="row g-3 mb-5">
      <input type="hidden" id="item-id" />
      <div class="col-md-4">
        <input type="text" id="name" class="form-control" placeholder="Nombre" required />
      </div>
      <div class="col-md-6">
        <input type="text" id="description" class="form-control" placeholder="Descripción" />
      </div>
      <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100">Guardar</button>
      </div>
    </form>

    <!-- Tabla de listado -->
    <table class="table table-striped bg-white">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-items"></tbody>
    </table>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
